# Application Configuration
app.name=Mew Agent
app.version=1.0.0
app.description=JavaFX application with AI agent capabilities

# UI Configuration
ui.default.width=800
ui.default.height=600
ui.min.width=600
ui.min.height=400

# Logging Configuration
logging.level.root=INFO
logging.level.mewagent=DEBUG

# Agent Configuration
agent.timeout.seconds=30
agent.max.retries=3

# LLM Configuration
llm.default.provider=OPENAI
# Add your API keys here (keep them secure!)
openai.api.key=your-openai-api-key-here
gemini.api.key=your-gemini-api-key-here

# Database Configuration
database.path=mew_agent.db

# Web Browser Configuration
browser.default=CHROME
browser.headless=false
webdriver.timeout.seconds=30

# Task Execution Configuration
task.max.concurrent=3
task.retry.attempts=2
